name: Unity Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify Unity activation secrets
        shell: bash
        run: |
          missing_secrets=""
          [ -z "${{ secrets.UNITY_LICENSE }}" ] && missing_secrets="UNITY_LICENSE"
          [ -z "${{ secrets.UNITY_EMAIL }}" ] && missing_secrets="$missing_secrets UNITY_EMAIL"
          [ -z "${{ secrets.UNITY_PASSWORD }}" ] && missing_secrets="$missing_secrets UNITY_PASSWORD"

          if [ -n "$missing_secrets" ]; then
            echo "::error::Missing required Unity activation secrets:$missing_secrets"
            echo "Add the missing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Unity activation secrets are present."

  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    needs: license-check
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-EditMode-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: editmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: EditMode
          unityVersion: 6000.3.20f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.editmode.outputs.artifactsPath }}

  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    needs: license-check
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-PlayMode-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-PlayMode-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: playmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: PlayMode
          unityVersion: 6000.3.20f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-test-results
          path: ${{ steps.playmode.outputs.artifactsPath }}
